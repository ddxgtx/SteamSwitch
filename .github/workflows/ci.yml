name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SteamSwitch.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build SteamSwitch.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/SteamSwitcher.Tests/SteamSwitcher.Tests.csproj -c Release --no-build --logger "trx;LogFileName=SteamSwitcher.Tests.trx"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Steam CEF session lifecycle
        run: node tests/cef-session-regression.cjs

      - name: Test WPF configuration application
        run: dotnet run --project tools/UiCapture/UiCapture.csproj -c Release -- artifacts/ui-smoke/settings.png settings-apply-smoke

      - name: Test WPF close-to-tray and full exit
        run: |
          dotnet run --project tools/UiCapture/UiCapture.csproj -c Release -- artifacts/ui-smoke/exit.png exit-lifecycle-smoke
          dotnet run --project tools/UiCapture/UiCapture.csproj -c Release -- artifacts/ui-smoke/direct-exit.png exit-direct-smoke

      - name: Test shared visual states and theme contrast
        run: |
          dotnet run --project tools/UiCapture/UiCapture.csproj -c Release -- artifacts/ui-smoke/states-light.png visual-states-smoke 1180 800 Light
          dotnet run --project tools/UiCapture/UiCapture.csproj -c Release -- artifacts/ui-smoke/states-dark.png visual-states-smoke 1180 800 Dark

      - name: Test WPF lyric display stability
        run: dotnet run --project tools/UiCapture/UiCapture.csproj -c Release -- artifacts/ui-smoke/lyrics-stability.png lyrics-stability-smoke 1180 800 Dark

      - name: Publish win-x64
        run: dotnet publish src/SteamSwitcher/SteamSwitcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish

      - name: Prepare installer input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish_zip -Force | Out-Null
          Copy-Item -Path artifacts/publish/* -Destination publish_zip -Recurse -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/SteamSwitcher.Tests/TestResults
          if-no-files-found: ignore

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: SteamSwitch-win-x64
          path: artifacts/publish

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SteamSwitch-installer
          path: installer/*.exe
